[project]
name = "salareen-thief"
version = "0.1.0"
description = "Distributed Cops-and-Robbers thief peer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=45,<47",
    "fastmcp>=2.0,<3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2,<9",
    "ruff>=0.16.3,<0.17",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
