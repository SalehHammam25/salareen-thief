[project]
name = "salareen-thief"
version = "0.1.0"
description = "Distributed Cops-and-Robbers thief peer"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
